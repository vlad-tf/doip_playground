<svg viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">DoIP Docker topology</title>
  <desc id="dsc">Three containers across two networks. PC-Tester connects over IPv4 network doip_frontend (172.30.100.0/24) to the EdgeNode, which bridges to the Echo ECU over IPv6 network doip_backend (fd2e:646f:6970::/64).</desc>
  <style>
    .t{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444441"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#378ADD"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="460" fill="#FFFFFF"/>

  <text class="t" x="20" y="34" font-size="17" font-weight="700" fill="#2C2C2A">DoIP Docker topology</text>
  <text class="t" x="20" y="52" font-size="11" fill="#888780">3 containers · 2 networks</text>

  <rect x="18" y="70" width="312" height="300" rx="14" fill="#E6F1FB" stroke="#85B7EB"/>
  <rect x="330" y="70" width="332" height="300" rx="14" fill="#E1F5EE" stroke="#5DCAA5"/>

  <text class="t" x="34" y="96" font-size="13" font-weight="700" fill="#0C447C">doip_frontend</text>
  <text class="m" x="34" y="113" font-size="10" fill="#185FA5">IPv4 · 172.30.100.0/24 · gw .1</text>

  <text class="t" x="348" y="96" font-size="13" font-weight="700" fill="#0F6E56">doip_backend</text>
  <text class="m" x="348" y="113" font-size="10" fill="#1D9E75">IPv6 ULA · fd2e:646f:6970::/64 · gw ::1</text>
  <text class="m" x="348" y="128" font-size="9" fill="#1D9E75">+ aux IPv4 172.30.101.0/24</text>

  <line x1="185" y1="225" x2="250" y2="225" stroke="#444441" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <line x1="410" y1="225" x2="470" y2="225" stroke="#444441" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <rect x="199" y="216" width="36" height="18" rx="9" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="m" x="217" y="229" font-size="8.5" text-anchor="middle" fill="#5F5E5A">13400</text>
  <rect x="422" y="216" width="36" height="18" rx="9" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="m" x="440" y="229" font-size="8.5" text-anchor="middle" fill="#5F5E5A">13400</text>

  <text class="t" x="217" y="300" font-size="9.5" text-anchor="middle" fill="#185FA5">plain DoIP · TCP</text>
  <text class="t" x="440" y="300" font-size="9.5" text-anchor="middle" fill="#1D9E75">DoIP over IPv6 · TCP</text>

  <rect x="35" y="178" width="150" height="94" rx="10" fill="#FFFFFF" stroke="#888780"/>
  <text class="t" x="110" y="205" font-size="14" font-weight="700" text-anchor="middle" fill="#2C2C2A">PC-Tester</text>
  <text class="t" x="110" y="222" font-size="10" text-anchor="middle" fill="#5F5E5A">doip-pc-tester</text>
  <text class="m" x="110" y="246" font-size="12" text-anchor="middle" fill="#2C2C2A">172.30.100.20</text>
  <text class="t" x="110" y="264" font-size="8.5" text-anchor="middle" fill="#888780">auto Routing Activation</text>

  <rect x="250" y="165" width="160" height="120" rx="10" fill="#FFFFFF" stroke="#444441" stroke-width="2"/>
  <text class="t" x="330" y="190" font-size="14" font-weight="700" text-anchor="middle" fill="#2C2C2A">EdgeNode</text>
  <text class="t" x="330" y="206" font-size="9.5" text-anchor="middle" fill="#5F5E5A">doip-edgenode · proxy</text>
  <text class="m" x="330" y="228" font-size="10" text-anchor="middle" fill="#2C2C2A">eth1  172.30.100.10</text>
  <text class="m" x="330" y="244" font-size="10" text-anchor="middle" fill="#2C2C2A">eth0  fd2e:646f:6970::10</text>
  <text class="m" x="330" y="260" font-size="9" text-anchor="middle" fill="#888780">aux   172.30.101.2</text>
  <text class="t" x="330" y="277" font-size="8.5" text-anchor="middle" fill="#888780">listens :13400 · :3496</text>

  <rect x="470" y="178" width="155" height="94" rx="10" fill="#FFFFFF" stroke="#888780"/>
  <text class="t" x="547" y="205" font-size="14" font-weight="700" text-anchor="middle" fill="#2C2C2A">Echo ECU</text>
  <text class="t" x="547" y="222" font-size="10" text-anchor="middle" fill="#5F5E5A">doip-echonode</text>
  <text class="m" x="547" y="246" font-size="12" text-anchor="middle" fill="#2C2C2A">fd2e:646f:6970::2</text>
  <text class="t" x="547" y="264" font-size="8.5" text-anchor="middle" fill="#888780">aux 172.30.101.x</text>

  <rect x="35" y="292" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#378ADD" stroke-dasharray="4 3"/>
  <text class="t" x="110" y="312" font-size="11" font-weight="700" text-anchor="middle" fill="#0C447C">DoIP Tests</text>
  <text class="t" x="110" y="327" font-size="9" text-anchor="middle" fill="#5F5E5A">(your test project)</text>
  <text class="m" x="110" y="344" font-size="8.5" text-anchor="middle" fill="#185FA5">attach → doip_frontend</text>
  <path d="M185,320 C215,320 225,262 250,250" fill="none" stroke="#378ADD" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arb)"/>

  <rect x="20" y="392" width="12" height="12" rx="2" fill="#85B7EB"/>
  <text class="t" x="38" y="402" font-size="10" fill="#5F5E5A">IPv4 frontend</text>
  <rect x="150" y="392" width="12" height="12" rx="2" fill="#5DCAA5"/>
  <text class="t" x="168" y="402" font-size="10" fill="#5F5E5A">IPv6 backend</text>

  <text class="t" x="20" y="424" font-size="9.5" fill="#888780">Ports: 13400/tcp plain DoIP · 3496/tcp TLS (passthrough) · 13400/udp discovery</text>
  <text class="t" x="20" y="440" font-size="9.5" fill="#888780">EdgeNode interfaces auto-detected at startup: eth0 = IPv6 backend, eth1 = IPv4 frontend.</text>
</svg>
