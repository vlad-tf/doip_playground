# DoIP EdgeNode — Docker configuration
# Mounted at /app/config.yaml in the doip-edgenode container.
#
# eth0 = frontend network (IPv4) toward PC-Tester / external test containers
# eth1 = backend  network (IPv6) toward the Echo ECU
network:
  tester_interface: "eth0"
  tester_ipv4: "172.30.100.10"   # static IPv4 on doip_frontend (must match compose)
  ecu_interface: "eth1"          # backend interface toward the Echo ECU

ports:
  doip_plain: 13400
  doip_tls: 3496

tls:
  server_cert: "certs/edgenode-server.crt"
  server_key:  "certs/edgenode-server.key"
  client_cert: "certs/edgenode-client.crt"
  client_key:  "certs/edgenode-client.key"
  ca_cert:     "certs/ca.crt"
  mutual_tls:  true
  tls_version: "TLSv1.3"
  cipher_suites:
    - "TLS_AES_128_GCM_SHA256"
    - "TLS_AES_256_GCM_SHA384"
    - "TLS_CHACHA20_POLY1305_SHA256"

doip:
  vin:       "1HGBH41JXMN109186"
  eid:       "AABBCCDDEEFF"
  gid:       "000000000000"
  node_type:         0x01
  node_logical_addr: 0x0000
  power_mode: 0x01
  max_payload_bytes: 4096
  # Accepted tester (client) source addresses for Routing Activation (ISO
  # 13400-2 Table 13) — a source address matching neither is denied with
  # response code 0x00. This is the only thing that gates which testers
  # EdgeNode accepts; it has no effect on diagnostic routing (see
  # routing_table below). Both are optional; default is the range alone.
  tester_addr_range: [0x0E00, 0x0FFF]
  tester_addr_list: []             # individual extra SAs outside the range

timers:
  t_tcp_initial_inactivity_s: 2
  t_tcp_general_inactivity_s: 300
  alive_check_interval_ms: 500

  # See doip_edgenode/config.yaml for the full explanation.
  ecu_response_timeout_s:   2.0    # per-frame wait after the Positive ACK
  ecu_pending_max_wait_s:   30.0   # whole-exchange cap while the ECU sends 0x78
  strict_response_matching: true   # drop a response that answers a different SID

udp:
  announce_count:    3
  announce_interval_ms: 500

# Routing is resolved by the Diagnostic Message's own TARGET address
# (ecu_logical_addr), one entry per physical ECU, first match wins. Any
# tester accepted above (doip.tester_addr_range/tester_addr_list) can reach
# any ECU listed here just by addressing a diag request to that ECU's
# logical address — no separate Routing Activation per ECU, and no tester
# binding in this table (that's gated entirely by doip: above). The SA
# EdgeNode presents to the ECU is always the activated session's own tester
# SA (see ecu_client.py's connect()).
#
# Several testers may share one ECU: each gets its own independent TCP
# session/ECUConnection to it (session.py's _ecu_conns, keyed per
# DoIPSession), so their diagnostic session and security level stay separate
# even though both resolve to this same entry. Two testers must NOT reuse
# one SA against the same ECU: that is an ISO 13400-2 §9.3 conflict and the
# ECU will alive-probe, then deny or evict.
routing_table:
  - ecu_logical_addr:    0x0001
    ecu_ipv6:            "fd2e:646f:6970::2"   # Echo ECU static IPv6 on doip_backend
    ecu_interface:       "eth1"
    ecu_port_plain:      13400
    ecu_port_tls:        3496
    ecu_sni:             ""

  - ecu_logical_addr:    0x0002
    ecu_ipv6:            "fd2e:646f:6970::3"   # TestEcu static IPv6 on doip_backend
    ecu_interface:       "eth1"
    ecu_port_plain:      13400
    ecu_port_tls:        3496
    ecu_sni:             ""

middleware:
  - type: LoggerMiddleware
    log_path: "/app/logs/doip.log"
    hex_dump: true

  - type: DropMiddleware
    enabled: false
    drop_rate: 0.0
    match:
      direction: "tester_to_ecu"

  - type: DelayMiddleware
    enabled: false
    delay_ms: 0
    jitter_ms: 0

  - type: CorruptMiddleware
    enabled: false
    byte_offset: null
    flip_mask: 0x01

  - type: ReplayMiddleware
    enabled: false
    record: false
    replay_count: 1

  - type: AddressMiddleware
    enabled: false
    src_override: null
    tgt_override: null

  - type: HeaderFaultMiddleware
    enabled: false
    fault: "wrong_version"
    direction: "tester_to_ecu"
    inject_on_nth: 1

  - type: TLSFaultMiddleware
    enabled: false
    fault: "wrong_cipher"
